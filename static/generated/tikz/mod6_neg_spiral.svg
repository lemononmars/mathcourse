    .node-bg { fill: #ffffff; stroke: #1e293b; stroke-width: 2; }
    .node-text { font-family: system-ui, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
  </style>

  <circle cx="0" cy="0" r="200" class="bg" />

  <line x1="0" y1="0" x2="0" y2="-200" class="sp-line" />
  <line x1="0" y1="0" x2="173.2" y2="-100" class="sp-line" />
  <line x1="0" y1="0" x2="173.2" y2="100" class="sp-line" />
  <line x1="0" y1="0" x2="0" y2="200" class="sp-line" />
  <line x1="0" y1="0" x2="-173.2" y2="100" class="sp-line" />
  <line x1="0" y1="0" x2="-173.2" y2="-100" class="sp-line" />

  <g transform="translate(0, -45)"><circle r="14" class="node-bg"/><text class="node-text">0</text></g>
  <g transform="translate(-49.8, -28.75)"><circle r="14" class="node-bg"/><text class="node-text">-1</text></g>
  <g transform="translate(-60.6, 35)"><circle r="14" class="node-bg"/><text class="node-text">-2</text></g>
